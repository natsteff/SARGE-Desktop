name: Build SARGE Desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: node --check ui/app.js
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: cargo test --locked --lib
        working-directory: desktop/src-tauri
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm exec tauri build --bundles nsis
        working-directory: desktop
      - name: Compile macOS bonus app
        if: runner.os == 'macOS'
        run: pnpm exec tauri build --no-bundle
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SARGE-Windows-x64-Beta
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
